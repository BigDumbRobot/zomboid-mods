<title>Workshop Mod Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Archivo:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: header and stat tiles on top, then one tabbed working area; a mod opens in a slide-over sheet.
   Look: a Knox County survivor's ledger. Charred paper darks, bone ink, typewriter headings,
   moodle-style status squares and quarantine tape. Single dark look on purpose. */
:root {
  color-scheme: dark;
  --ink: #e8e0cb; --muted: #9d947d; --line: #3b3528; --bg: #100f0c; --card: #1b1914; --raise: #27231b;
  --b1: #8db554; --b2: #86a7a3; --b3: #c9573c; --b4: #dba63a; --bad: #e4604b; --bad-bg: #2d1612; --warn-bg: #2c2510; --good-bg: #1c2613;
  --on-tone: #14130f;
  --head: "Special Elite", "Courier New", monospace; --body: Archivo, system-ui, sans-serif; --mono: "Share Tech Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg) radial-gradient(ellipse 120% 60% at 50% 0, #1d1a13 0, var(--bg) 70%) fixed; color: var(--ink); font: 15px/1.45 var(--body); }
h1, h2, h3, .stat strong, .tabs button, .big { font-family: var(--head); }
h1 { font-size: 1.55rem; letter-spacing: .08em; margin: 0; text-transform: uppercase; color: var(--bad); font-weight: 400; }
h2, h3, .big, .stat strong, .tabs button { font-weight: 400; }
h1 span { letter-spacing: 0; color: var(--muted); font-size: 1rem; margin-left: 8px; text-transform: none; font-family: var(--body); }
button { font: inherit; cursor: pointer; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 2px; padding: 7px 12px; }
button:focus-visible, a:focus-visible, select:focus-visible, tr:focus-visible { outline: 2px solid var(--b2); outline-offset: 2px; }
a { color: var(--b2); text-decoration: none; } a:hover { text-decoration: underline; }
select { font: inherit; color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 2px; padding: 6px 10px; max-width: 100%; }
.muted { color: var(--muted); } .bad { color: var(--bad); } .good { color: var(--b1); }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); }
.link { border: 0; padding: 0; color: var(--ink); font-weight: 700; text-align: left; } .link:hover { color: var(--b1); }

.dash { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 0 60px; }
.dash > header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0 12px; flex-wrap: wrap; gap: 10px; }
.right { display: flex; align-items: center; gap: 14px; font-size: .9rem; flex-wrap: wrap; }
.live { color: var(--muted); } .live i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 5px; }
.live.on i { background: var(--b1); animation: pulse 2s infinite; }
.live i { border-radius: 0 !important; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .live.on i { animation: none; } }
/* Knox exclusion zone tape */
.stripe { height: 7px; background: repeating-linear-gradient(-45deg, var(--b4) 0 12px, #17150f 12px 24px); opacity: .85; }

.alerts { margin-top: 14px; border: 1px solid var(--b4); background: var(--warn-bg); padding: 10px 14px; }
.alerts header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
.alerts h2 { font-size: 1rem; margin: 0; color: var(--b4); } .alerts .line:first-of-type { border-top: 0; }
.tag.alert { background: var(--b4); color: var(--on-tone); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 18px 0; }
/* each tile carries a moodle: the small square status icon from the game HUD */
.stat { position: relative; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 2px; padding: 14px 40px 14px 16px; min-width: 0; }
.stat::after { content: ""; position: absolute; top: 12px; right: 12px; width: 16px; height: 16px; background: var(--tone); border: 2px solid var(--on-tone); outline: 1px solid var(--tone); }
.stat:hover { background: var(--raise); }
.stat span { display: block; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; } .stat strong { display: block; font-size: 1.9rem; font-family: var(--mono); margin: 2px 0; } .stat small { color: var(--muted); }
.stat.b1 { --tone: var(--b1); } .stat.b2 { --tone: var(--b2); } .stat.b3 { --tone: var(--b3); } .stat.b4 { --tone: var(--b4); }
.stat.alert { --tone: var(--bad); background: var(--bad-bg); border-color: var(--bad); } .stat.alert strong { color: var(--bad); }

.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 10px 16px; color: var(--muted); white-space: nowrap; text-transform: uppercase; letter-spacing: .06em; font-size: .95rem; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--bad); }
.tabs button b { font-family: var(--mono); font-weight: 400; color: var(--on-tone); background: var(--bad); padding: 0 6px; margin-left: 6px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 2px; padding: 16px; overflow-x: auto; min-width: 0; }
.panel + .panel, .cards + .panel, .panel + .cards, .grid2 + .panel { margin-top: 14px; }
.panel h2 { margin: 0 0 12px; font-size: 1.15rem; } .panel h2 small { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: .85rem; margin-left: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; } .grid2 .panel + .panel { margin-top: 0; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.bar-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border-radius: 2px; padding: 5px 12px; font-size: .85rem; color: var(--muted); }
.filters button.on { background: var(--ink); border-color: var(--ink); color: var(--on-tone); font-weight: 700; }
.filters button.on.warn { background: var(--bad); border-color: var(--bad); color: var(--on-tone); }

.line { display: flex; gap: 12px; align-items: baseline; padding: 10px 6px; border-top: 1px solid var(--line); }
.line.flag { background: var(--warn-bg); border-left: 4px solid var(--b4); }
.line .what { flex: 1; min-width: 0; overflow-wrap: anywhere; } .line .what p { margin: 4px 0 0; white-space: pre-wrap; }
.line time { color: var(--muted); font-size: .82rem; white-space: nowrap; }
.tag { flex: none; width: 92px; text-align: center; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 0; border-radius: 0; background: var(--raise); color: var(--muted); }
.tag.subs { background: var(--b1); color: var(--on-tone); } .tag.comment { background: var(--b2); color: var(--on-tone); } .tag.favs { background: var(--b4); color: var(--on-tone); }
.tag.votes { background: var(--b3); color: var(--on-tone); } .tag.lost { background: var(--bad); color: var(--on-tone); }
@media (max-width: 560px) { .line { flex-wrap: wrap; } .line .what { flex-basis: 100%; order: 3; } }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; padding: 6px 10px; white-space: nowrap; }
th button { border: 0; padding: 0; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; } th button.on { color: var(--ink); }
td { padding: 10px; border-top: 1px solid var(--line); vertical-align: middle; } td small { display: block; color: var(--muted); }
th.r, td.r { text-align: right; white-space: nowrap; }
tbody tr.pick { cursor: pointer; } tbody tr.pick:hover { background: var(--raise); }
.modcell { display: flex; gap: 12px; align-items: center; min-width: 240px; }
.thumb { flex: none; width: 44px; height: 44px; border-radius: 0; border: 1px solid var(--line); object-fit: cover; background: var(--raise); display: grid; place-content: center; font-family: var(--head); font-weight: 700; color: var(--muted); }
.status { display: inline-block; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 0; background: var(--raise); color: var(--muted); white-space: nowrap; text-transform: uppercase; letter-spacing: .05em; }
.status.public { background: var(--good-bg); color: var(--b1); } .status.warn { background: var(--warn-bg); color: var(--b4); } .status.alert { background: var(--bad-bg); color: var(--bad); }
.d { font-size: .82rem; margin-left: 6px; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--b1); border-radius: 2px; padding: 14px 16px; min-width: 0; }
.card.alert { border-left-color: var(--bad); background: var(--bad-bg); } .card.warn { border-left-color: var(--b4); } .card.info { border-left-color: var(--b2); }
.card h3 { margin: 0; font-size: .78rem; color: var(--muted); font-family: var(--body); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; } .big { font-size: 1.6rem; margin: 6px 0 4px; } .card p { margin: 4px 0 0; }
.card ul { margin: 8px 0 0; padding: 0; list-style: none; } .card li { padding: 5px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; } .card li .num { white-space: nowrap; }

.bar { display: grid; grid-template-columns: minmax(110px, 190px) 1fr 64px minmax(0, 130px); gap: 12px; align-items: center; padding: 6px 0; }
.bar .track { height: 20px; background: var(--raise); border: 1px solid var(--line); overflow: hidden; } .bar .track i { display: block; height: 100%; min-width: 2px; }
.bar small { color: var(--muted); } .bar > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
i.b1 { background: var(--b1); } i.b2 { background: var(--b2); } i.b3 { background: var(--b3); } i.b4 { background: var(--b4); }
@media (max-width: 560px) { .bar { grid-template-columns: minmax(90px, 120px) 1fr 54px; } .bar small { display: none; } }
.columns { display: flex; align-items: flex-end; gap: 6px; height: 170px; overflow-x: auto; }
.columns > div { flex: 1; min-width: 34px; max-width: 70px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.columns i { width: 100%; background: var(--b1); min-height: 2px; } .columns i.neg { background: var(--bad); }
.columns span { font-size: .8rem; order: -1; } .columns small { color: var(--muted); font-size: .7rem; white-space: nowrap; }
.chart { position: relative; } .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 4px 8px; border-radius: 0; font-family: var(--mono); font-size: .8rem; white-space: nowrap; transform: translate(-50%, -135%); }
.empty { color: var(--muted); padding: 18px 6px; margin: 0; }

.signin { min-height: 100vh; display: grid; place-content: center; gap: 16px; text-align: center; padding: 20px; }
.signin form { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.signin input { padding: 10px 12px; border-radius: 2px; border: 1px solid var(--line); background: var(--raise); color: var(--ink); font: inherit; width: min(260px, 100%); }
.signin button { background: var(--bad); color: var(--on-tone); border: 0; font-weight: 700; }
.sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; justify-content: flex-end; z-index: 5; }
.sheet .inner { width: min(640px, 100%); height: 100%; overflow-y: auto; background: var(--card); padding: 20px; border-left: 1px solid var(--line); }
.sheet header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; } .sheet h2 { margin: 0; font-size: 1.3rem; }
.sheet h3 { font-size: .78rem; font-family: var(--body); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 6px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; } .sheet p { margin: 4px 0; }
.hero { display: flex; gap: 14px; align-items: center; margin-top: 14px; } .hero .thumb { width: 84px; height: 84px; font-size: 1.6rem; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kv div { background: var(--raise); border: 1px solid var(--line); padding: 9px 11px; } .kv span { display: block; color: var(--muted); font-size: .78rem; } .kv b { font-family: var(--mono); font-size: 1.2rem; font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; } .chips span { background: var(--raise); border: 1px solid var(--line); padding: 2px 9px; font-size: .82rem; }
.mono { font-family: var(--mono); font-size: .85rem; }
</style>

<div class="dash">
  <header>
    <h1 id="brand">Workshop <span>mod desk</span></h1>
    <div class="right">
      <span class="live" id="live"><i></i><span id="liveText">Snapshot</span></span>
      <button id="refresh" hidden>Refresh now</button>
      <button id="signout" hidden>Sign out</button>
      <a id="profile" target="_blank" rel="noopener" hidden>Steam Workshop ↗</a>
    </div>
  </header>
  <div class="stripe"></div>
  <section class="alerts" id="alerts" aria-label="New alerts" hidden></section>
  <section class="stats" id="stats" aria-label="Totals across all mods"></section>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main id="view"></main>
</div>
<div class="sheet" id="sheet" hidden></div>
<div class="signin" id="signin" hidden>
  <h1 id="signinBrand">Workshop <span>mod desk</span></h1>
  <form id="signinForm"><input id="signinKey" type="password" placeholder="Dashboard key" autocomplete="current-password" aria-label="Dashboard key"><button type="submit">Sign in</button></form>
  <p class="bad" id="signinWrong" hidden>That key is not right.</p>
</div>

<script>
let DATA = /*__DATA__*/null;
const TABS = [["activity", "Activity"], ["mods", "Mods"], ["comments", "Comments"], ["trends", "Trends"], ["marketing", "Marketing"], ["community", "Community"], ["server", "Test server"], ["servers", "In the wild"]];
const METRICS = { subs: "Subscribers", life_subs: "Lifetime subs", views: "Views", favs: "Favorites", conv: "Conversion %" };
const S = { tab: "activity", actFilter: "all", modFilter: "all", modSort: "subs", modAsc: false, comFilter: "all", comMod: "all", metric: "subs", trendMod: "all", open: null, openSession: null, live: false };

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k.startsWith("on")) n[k] = v; else if (k in n && k !== "list") n[k] = v; else n.setAttribute(k, v);
  }
  n.append(...kids.flat(Infinity).filter(k => k != null && k !== false && k !== ""));
  return n;
}
const fmt = n => n == null ? "–" : Math.round(n).toLocaleString("en-US");
const pc = (v, d = 1) => v == null ? "–" : v.toFixed(d) + "%";
const ratio = (a, b) => b ? a / b * 100 : null;
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n));
const shortDay = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
const dateOf = ts => new Date(ts * 1000).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
function rel(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 90) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " h ago";
  const d = Math.round(s / 86400); return d < 31 ? d + " d ago" : dateOf(ts);
}
const url = { item: id => "https://steamcommunity.com/sharedfiles/filedetails/?id=" + id, comments: id => "https://steamcommunity.com/sharedfiles/filedetails/comments/" + id, changes: id => "https://steamcommunity.com/sharedfiles/filedetails/changelog/" + id };
const ext = (href, text) => h("a", { href, target: "_blank", rel: "noopener" }, text);

/* ---------- derived data ---------- */
let ids, hist, last, waiting;
function derive() {
  ids = Object.keys(DATA.meta); hist = DATA.history; last = hist[hist.length - 1];
  // A comment is waiting when it is newer than your latest reply on that mod.
  waiting = new Set();
  for (const id of ids) for (const c of DATA.comments[id] || []) { if (c.own) break; waiting.add(c.id); }
}
const now = id => last.mods[id] || {};
const isPublic = id => DATA.meta[id].visibility === "public";
// Under 20 views the ratio is noise (your own visits count), so it is left blank.
const conv = s => s && s.views >= 20 ? ratio(s.life_subs, s.views) : null;
const kept = s => s && s.life_subs >= 5 ? ratio(s.subs, s.life_subs) : null;
function snapAgo(days) {
  const cut = new Date(new Date(last.date + "T12:00:00").getTime() - days * 864e5).toISOString().slice(0, 10);
  let hit = null; for (const s of hist) if (s.date <= cut) hit = s; return hit;
}
function delta(id, key, days) { const b = snapAgo(days); return b && b.mods[id] ? (now(id)[key] || 0) - (b.mods[id][key] || 0) : null; }
const total = (snap, key) => snap ? Object.values(snap.mods).reduce((t, s) => t + (s[key] || 0), 0) : null;
function totalDelta(key, days) { const b = snapAgo(days); return b ? total(last, key) - total(b, key) : null; }
function metricAt(snap, id, metric) {
  if (id === "all") return metric === "conv" ? ratio(total(snap, "life_subs"), total(snap, "views")) : total(snap, metric);
  const s = snap.mods[id]; if (!s) return null; return metric === "conv" ? ratio(s.life_subs, s.views) : s[metric];
}
const series = (id, metric) => hist.map(s => ({ date: s.date, v: metricAt(s, id, metric) })).filter(p => p.v != null);
const show = (metric, v) => metric === "conv" ? pc(v) : fmt(v);
const median = arr => { const a = [...arr].sort((x, y) => x - y); return a.length ? (a[(a.length - 1) >> 1] + a[a.length >> 1]) / 2 : null; };

/* ---------- small components ---------- */
function thumb(id) {
  const m = DATA.meta[id];
  return m.thumb ? h("img", { class: "thumb", src: m.thumb, alt: "" }) : h("span", { class: "thumb" }, m.title.slice(0, 2).toUpperCase());
}
const modLink = id => h("button", { class: "link", onclick: e => { e.stopPropagation(); openSheet(id); } }, DATA.meta[id].title);
function deltaChip(d) { return d ? h("span", { class: "d " + (d > 0 ? "good" : "bad") }, signed(d)) : null; }
function pills(options, value, pick) {
  return h("div", { class: "filters" }, options.map(([k, label, warn]) => h("button", { class: (k === value ? "on" : "") + (warn ? " warn" : ""), onclick: () => pick(k) }, label)));
}
function modSelect(value, pick, counts) {
  const sel = h("select", { "aria-label": "Mod", onchange: e => pick(e.target.value) }, h("option", { value: "all" }, "All mods"),
    [...ids].sort((a, b) => DATA.meta[a].title.localeCompare(DATA.meta[b].title)).map(id => h("option", { value: id }, DATA.meta[id].title + (counts && counts[id] ? ` (${counts[id]})` : ""))));
  sel.value = value; return sel;
}
function barRow(label, value, max, text, note, tone) {
  return h("div", { class: "bar" }, h("span", {}, label), h("div", { class: "track" }, h("i", { class: tone || "b1", style: `width:${max ? Math.max(0, value) / max * 100 : 0}%` })), h("b", { class: "num" }, text), h("small", {}, note || ""));
}
function columns(points, metric) {
  if (!points.length) return h("p", { class: "empty" }, "Daily change needs two snapshots. The second one lands tomorrow.");
  const max = Math.max(1, ...points.map(p => Math.abs(p.v)));
  return h("div", { class: "columns" }, points.map(p => h("div", { title: `${shortDay(p.date)}: ${signed(p.v)}` },
    h("span", { class: "num" }, metric === "conv" ? p.v.toFixed(1) : signed(p.v)), h("i", { class: p.v < 0 ? "neg" : "", style: `height:${Math.abs(p.v) / max * 100}%` }), h("small", {}, shortDay(p.date)))));
}
const dailyChange = pts => pts.slice(1).map((p, i) => ({ date: p.date, v: p.v - pts[i].v }));
function lineChart(pts, metric, label) {
  const box = h("div", { class: "chart" });
  if (!pts.length) { box.append(h("p", { class: "empty" }, "No data for this mod yet.")); return box; }
  const W = 640, H = 250, L = 50, R = 18, T = 18, B = 28;
  const top = Math.max(...pts.map(p => p.v)) * 1.08 || 1, mag = Math.pow(10, Math.floor(Math.log10(top)));
  const max = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => k >= top);
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1), y = v => T + (1 - v / max) * (H - T - B);
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${show(metric, v)}</text>`; }
  const step = Math.max(1, Math.ceil(pts.length / 7));
  pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${shortDay(p.date)}</text>`; });
